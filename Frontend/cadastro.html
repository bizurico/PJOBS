<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <a href="index.html" class="logo">PJobs</a>
  </header>
  <div class="container">
  <h2>Cadastro</h2>
  <form id="formCadastro" onsubmit="cadastrarUsuario(event)">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required />

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required />

    <label for="cpf">CPF:</label>
    <input type="text" id="cpf" name="cpf" required />

    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha" required />

    <label for="tipo">Tipo de usuário:</label>
    <select id="tipo" name="tipo" required>
      <option value="cliente">Cliente</option>
      <option value="prestador">Prestador</option>
    </select>

    <div id="area-container" style="display: none;">
      <label for="area">Área de trabalho</label>
      <select id="area" name="area">
        <option value="">Selecione</option>
        <option value="Encanador">Encanador</option>
        <option value="Eletricista">Eletricista</option>
        <option value="Pintor">Pintor</option>
        <option value="Faxina">Faxina</option>
      </select>
    </div>

    <button type="submit">Cadastrar</button>
  </form>
</div>

    <p>Já tem uma conta? <a href="index.html">Faça login</a></p>
  <script src="script.js"></script>
</body>
</html>
