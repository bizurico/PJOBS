<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<header>
    <nav id="nav-principal">        
        <div id="menu-usuario-logado" class="user-dropdown" style="display: none;">
            <button id="user-greeting-button" class="dropdown-toggle">
                Olá, Usuário
            </button>
            <div id="dropdown-menu-content" class="dropdown-content">
                <a href="perfil.html">Meus Dados</a>
                <a href="#" onclick="abrirAbaHistorico(event)">Histórico</a>
                <a href="#" id="btn-logout">Sair</a>
            </div>
        </div>
    </nav>
</header>

<body class="tela-cadastro">
  <main class="container">
    <h2>Cadastro</h2>
    <form id="formCadastro">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" required />

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required />
      
      <label for="confirmar-senha">Confirmar Senha:</label>
      <input type="password" id="confirmar-senha" name="confirmar-senha" required />

      <label for="cidade">Cidade:</label>
    <input type="text" id="cidade" name="cidade" required>

    <label for="contato">Contato (Telefone):</label>
    <input type="tel" id="contato" name="contato" placeholder="(XX) XXXXX-XXXX" required>

      <label for="tipo">Tipo de usuário:</label>
      <select id="tipo" name="tipo" required>
        <option value="cliente">Cliente</option>
        <option value="prestador">Prestador</option>
      </select>

      <div id="area-container" style="display:none;">
        <label for="area">Área de trabalho</label>
        <select id="area" name="area">
          <!-- Populado via JS -->
        </select>
      </div>
      <button class="btn-voltar" onclick="window.history.back()">← Voltar</button>
      <button type="submit">Cadastrar</button>
    </form>

    <p class="texto-troca-form">Já tem uma conta? <a href="index.html">Faça login</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
